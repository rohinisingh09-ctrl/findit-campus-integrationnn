<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FindIt@Campus</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Login Page -->
    <div class="login-page">
        <div class="login-card">
            <div class="login-logo">FindIt@Campus</div>
            <h1>Welcome Back!</h1>
            <p class="login-subtitle">Login using your college email to continue.</p>

            <div id="loginAlert" style="display: none;"></div>

            <form id="loginForm">
                <label for="email">College Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="yourname@sru.edu.in"
                    required
                >
                <button type="submit" id="sendOtpBtn" class="primary-btn login-submit">
                    Send OTP
                </button>
            </form>

            <div id="otpSection" class="otp-section" style="display: none;">
                <label for="otp">Enter OTP</label>
                <input
                    type="text"
                    id="otp"
                    placeholder="Enter 6-digit OTP"
                    maxlength="6"
                >
                <button type="button" id="verifyOtpBtn" class="primary-btn login-submit">
                    Verify OTP
                </button>
                <p id="loginMessage"></p>
            </div>

            <p class="login-note">
                🔒 Only registered college email addresses are allowed (@sru.edu.in).
            </p>

            <a href="index.html" class="back-home">
                ← Back to Home
            </a>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
