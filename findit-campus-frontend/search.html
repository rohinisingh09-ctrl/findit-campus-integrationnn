<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Items | FindIt@Campus</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation -->
    <header>
        <div class="logo">FindIt@Campus</div>
        <nav id="mainNav">
            <a href="index.html">Home</a>
            <a href="report-lost.html">Report Lost</a>
            <a href="report-found.html">Report Found</a>
            <a href="search.html">Search Items</a>
            <a href="login.html" class="login-btn" id="navAuthBtn">Login</a>
        </nav>
    </header>

    <!-- Search Section -->
    <section class="search-page">
        <div class="search-container">
            <div class="search-heading">
                <p class="welcome">FIND YOUR ITEM</p>
                <h1>Search Lost & Found Items</h1>
                <p>
                    Search reported items across campus and find a possible match.
                </p>
            </div>

            <!-- Search Box -->
            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search for an item by name or keywords..."
                >
                <button
                    class="primary-btn"
                    id="searchBtn"
                    onclick="searchItems()"
                >
                    🔍 Search
                </button>
            </div>

            <!-- Filters -->
            <div class="filters">
                <select id="typeFilter" onchange="searchItems()">
                    <option value="">All Item Types</option>
                    <option value="lost">Lost Items</option>
                    <option value="found">Found Items</option>
                </select>

                <select id="categoryFilter" onchange="searchItems()">
                    <option value="">All Categories</option>
                    <option value="Bag">Bag</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Books">Books</option>
                    <option value="ID Card">ID Card</option>
                    <option value="Clothing">Clothing</option>
                    <option value="Accessories">Accessories</option>
                    <option value="Other">Other</option>
                </select>

                <input
                    type="text"
                    id="locationFilter"
                    placeholder="Filter by location (e.g. Library)"
                    oninput="debounceSearch()"
                >
            </div>

            <!-- Results -->
            <div id="searchResults" class="search-results">
                <div class="empty-message">
                    <div class="empty-icon">🔍</div>
                    <h3>Loading items...</h3>
                </div>
            </div>
        </div>
    </section>

    <!-- Details Modal Placeholder -->
    <div id="itemModal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <button class="modal-close-btn" onclick="closeModal()">&times;</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
